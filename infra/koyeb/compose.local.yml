name: streamface-cloud-local

services:
  cloud:
    build:
      context: ../..
      dockerfile: infra/koyeb/Dockerfile
    image: streamface-cloud-local
    init: true
    environment:
      PORT: "8000"
      PUBLIC_ORIGIN: http://127.0.0.1:${CLOUD_PORT:-3010}
      SESSION_SECRET: local-development-only-secret-000000000000
      LEXICON_NAMESPACE: live.streamface
      AUTH_DATA_DIR: /data/auth
      GIPHY_API_KEY: ${GIPHY_API_KEY:-}
    ports:
      - 127.0.0.1:${CLOUD_PORT:-3010}:8000
    volumes:
      - cloud-auth:/data/auth
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:8000/health').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    stop_grace_period: 10s

volumes:
  cloud-auth:
    # Preserve the existing credential volume across the Streamface rename.
    name: ${CLOUD_AUTH_VOLUME:-stream-overlay-cloud-auth}
