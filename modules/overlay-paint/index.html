<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Overlay Paint</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; }
      body[data-interactive="true"] canvas { cursor: url("/overlays/overlay-paint/pencil-cursor.svg") 4 28, crosshair; }
      #status { position: absolute; bottom: 8px; left: 8px; padding: 5px 8px; border-radius: 6px; color: white; background: #111827dd; font: 12px system-ui; pointer-events: none; }
      #status:empty { display: none; }
    </style>
  </head>
  <body>
    <canvas aria-label="Temporary stream drawing canvas"></canvas>
    <span id="status" role="status"></span>
    <script type="module" src="/overlays/overlay-paint/client.js"></script>
  </body>
</html>
