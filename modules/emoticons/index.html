<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Emoticons</title><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}#effect{position:absolute;top:5vh;left:50%;transform:translateX(-50%);display:flex;align-items:flex-start;justify-content:center;width:40vw;height:35vh}#effect img{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}#board{padding:16px;box-sizing:border-box;color:white;font:600 20px/1.4 system-ui;text-shadow:0 2px 4px #000;display:grid;gap:10px}#board h1{font-size:1em;margin:0}#board ul{padding:0;margin:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(180px,100%),1fr));gap:10px}#board li{background:#111827dd;border-radius:10px;padding:10px;overflow-wrap:anywhere}#board small{display:block;font-size:.8em;font-weight:400} [hidden]{display:none!important}
</style></head><body><div id="effect" hidden></div><section id="board" hidden><h1>Chat emoticons</h1><ul></ul></section><script type="module" src="/overlays/emoticons/client.js"></script></body></html>
