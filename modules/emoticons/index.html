<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Emoticons</title><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}#effect{position:absolute;top:5vh;left:50%;transform:translateX(-50%);display:flex;align-items:flex-start;justify-content:center;width:40vw;height:35vh}#effect img,#effect video{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}#board{padding:16px;box-sizing:border-box;color:white;font:600 20px/1.4 system-ui;text-shadow:0 2px 4px #000;display:grid;gap:10px}#board h2{font-size:1em;margin:0 0 10px}#board ul{padding:0;margin:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(180px,100%),1fr));gap:10px}#board li{background:#111827dd;border-radius:10px;padding:10px;overflow-wrap:anywhere}#board small{display:block;font-size:.8em;font-weight:400} [hidden]{display:none!important}
.sticker{position:absolute;bottom:0;display:flex;align-items:center;justify-content:center;pointer-events:none;animation:sticker-rise 8s linear forwards}.sticker-media{width:100%;height:100%;display:flex;align-items:center;justify-content:flex-start;transform-origin:left center}.sticker-media img,.sticker-media video{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}@keyframes sticker-rise{0%{transform:translate(-50%,100%);opacity:1}85%{opacity:1}100%{transform:translate(calc(-50% + var(--drift)),calc(-100vh - 100%));opacity:0}}
#effect .sender-avatar,.sticker .sender-avatar{position:absolute;right:calc(100% + 10px);top:0;width:40px;height:40px;max-width:none;max-height:none;border-radius:50%;object-fit:cover}.sticker .sender-avatar{width:28px;height:28px;top:50%;transform:translateY(-50%)}
#effect .sender-avatar{right:calc(100% + 42px)}#effect .speech-bubble-tail{position:absolute;right:calc(100% + 4px);top:4px;width:32px;height:32px;max-width:none;max-height:none;object-fit:contain;transform:rotate(90deg)}
#board li{display:flex;align-items:center;gap:10px}#board li strong{flex:1;min-width:0}.cooldown-ring{width:1.4em;height:1.4em;flex:none;fill:none;stroke:#526078;stroke-width:3;transform:rotate(-90deg)}.cooldown-progress{stroke:#a7bcff}.cooling-down .cooldown-progress{stroke:#fbbf24}
#board .sticker-preview{width:1.4em;height:1.4em;flex:none;object-fit:contain}
</style></head><body><div id="effect" hidden></div><section id="board" hidden><ul></ul></section><script type="module" src="/overlays/emoticons/client.js"></script></body></html>
