<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Emoticons</title><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}#effect{position:absolute;top:5vh;left:50%;transform:translateX(-50%);display:flex;align-items:flex-start;justify-content:center;width:max-content;height:max-content}#effect img,#effect video{display:block;max-width:40vw;max-height:35vh;width:auto;height:auto;object-fit:contain}#board{height:100%;padding:16px;box-sizing:border-box;overflow-y:auto;scrollbar-width:thin;color:white;font:600 20px/1.4 system-ui;text-shadow:0 2px 4px #000;display:grid;grid-template-rows:max-content max-content;align-content:start;gap:10px}#board h2{font-size:1em;margin:0 0 4px}#board ul{padding:0;margin:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(180px,100%),1fr));gap:10px}#board li{background:#111827dd;border-radius:10px;padding:10px;overflow-wrap:anywhere}#board small{display:block;font-size:.8em;font-weight:400}#board .usage{margin:0 0 10px;font-size:.72em;font-weight:400}#board .usage code{display:inline-block;padding:.08em .35em;border-radius:.3em;background:#111827dd;font:600 .95em/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;text-shadow:none}[hidden]{display:none!important}
.sticker{position:absolute;bottom:0;display:flex;align-items:center;justify-content:center;pointer-events:none;animation:sticker-rise 8s linear forwards}.sticker-media{width:max-content;height:max-content;display:flex;align-items:center;justify-content:flex-start;transform-origin:left center}.sticker-media img,.sticker-media video{max-width:none;max-height:none;width:auto;height:auto;object-fit:contain}@keyframes sticker-rise{0%{transform:translate(-50%,100%);opacity:1}85%{opacity:1}100%{transform:translate(calc(-50% + var(--drift)),calc(-50vh + 50%));opacity:0}}
#effect .sender-avatar,.sticker .sender-avatar{position:absolute;right:calc(100% + 10px);top:0;width:40px;height:40px;max-width:none;max-height:none;border-radius:50%;object-fit:cover}.sticker .sender-avatar{width:28px;height:28px;top:50%;transform:translateY(-50%)}
#effect .sender-avatar{right:calc(100% + 42px)}#effect .speech-bubble-tail{position:absolute;right:100%;top:14px;width:32px;height:32px;max-width:none;max-height:none;object-fit:contain;transform:rotate(90deg)}
#board li{position:relative;isolation:isolate;display:flex;align-items:center;gap:10px;overflow:hidden}#board li strong{position:relative;z-index:1;flex:1;min-width:0}.cooldown-ring{position:relative;z-index:1;width:1.4em;height:1.4em;flex:none;fill:none;stroke:#526078;stroke-width:3;transform:rotate(-90deg)}.cooldown-progress{stroke:#a7bcff}.cooling-down .cooldown-progress{stroke:#fbbf24}
#board .clip-preview{position:absolute;z-index:0;inset:0 auto 0 0;width:auto;height:100%;max-width:none;object-fit:contain;pointer-events:none;-webkit-mask-image:linear-gradient(to right,#000 0%,#000 70%,transparent 100%);mask-image:linear-gradient(to right,#000 0%,#000 70%,transparent 100%)}#board .sticker-preview{width:1.4em;height:1.4em;flex:none;object-fit:contain}
</style></head><body><div id="effect" hidden></div><section id="board" hidden><ul></ul></section><script type="module" src="/overlays/emoticons/client.js"></script></body></html>
