<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>Stream Overlay Cloud</title><style>body{max-width:880px;margin:40px auto;padding:0 20px;background:#101522;color:#eef2ff;font:16px system-ui}input,button,textarea{font:inherit;padding:10px;border-radius:8px;border:1px solid #607099;background:#182035;color:inherit}textarea{width:100%;min-height:420px;box-sizing:border-box}button{cursor:pointer}.row{display:flex;gap:10px;margin:12px 0}.status{min-height:24px}code{word-break:break-all}.login-form{position:relative;display:flex;gap:10px}.login-form input{min-width:0;flex:1}.login-status{min-height:24px;color:#aab5cc}.actor-suggestions{position:absolute;z-index:20;top:calc(100% + 8px);left:0;right:0;overflow:hidden;border:1px solid #36425d;border-radius:12px;background:#111827;box-shadow:0 16px 40px #0007}.actor-suggestions[hidden]{display:none}.actor-suggestions button{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:0;border-radius:0;background:transparent;text-align:left}.actor-suggestions button:hover,.actor-suggestions button[aria-selected=true]{background:#202a40}.actor-suggestions img,.avatar-placeholder{width:40px;height:40px;flex:0 0 40px;border-radius:50%;object-fit:cover;background:#303a51}.actor-suggestions button>span:last-child{display:grid;gap:2px}.actor-suggestions small{color:#9aa6c1}</style></head><body><main id="app"></main><script type="module" src="/src/cloud-admin.ts"></script></body></html>
